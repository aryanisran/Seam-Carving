name: CI/CD

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # needed to publish releases on tags

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ---- C++ (graph cut, DP, greedy) -------------------------------------
      - name: Build (g++ -O3, -Wall -Wextra -Wpedantic)
        run: make all

      - name: C++ unit tests
        run: make test

      # ---- Web visualizer (React + TypeScript) ------------------------------
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Web tests (TypeScript algorithms vs the C++ binary, seam-for-seam and pixel-for-pixel)
        working-directory: web
        run: npm test

      - name: Type-check and build the web app
        working-directory: web
        run: npm run build

      # ---- Python visualiser (GIF / overlay / comparison renders) -----------
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: bonus/requirements.txt

      - name: Install Python dependencies
        run: pip install -r bonus/requirements.txt

      - name: Python tests (incl. C++ <-> Python integration)
        run: python -m pytest bonus/tests -v

      # ---- Demo run: carve a sample and render all visualisations ---------
      - name: Carve sample image
        run: |
          python bonus/make_sample.py
          mkdir -p demo
          ./bin/seam_carve -i samples/synthetic_tower.png -o demo/carved.png \
            --remove-cols 40 --remove-rows 15 --solver dinic \
            --export-seams demo/seams.json --compare --export-csv demo/benchmark.csv

      - name: Render visualisations
        run: python bonus/visualize.py --image samples/synthetic_tower.png --seams demo/seams.json --out demo

      - name: Upload demo outputs
        uses: actions/upload-artifact@v4
        with:
          name: seam-carving-demo
          path: |
            demo/
            bin/seam_carve

  deploy-web:
    # CD: every push to main publishes the visualizer to GitHub Pages.
    # Skipped until Pages is set up, so main stays green. One-time setup by the repo owner:
    #   1. Settings -> Pages -> Source: "GitHub Actions"
    #   2. Settings -> Secrets and variables -> Actions -> Variables -> New variable ENABLE_PAGES = true
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && vars.ENABLE_PAGES == 'true'
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - id: pages
        uses: actions/configure-pages@v5
      - name: Build for Pages
        working-directory: web
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
        run: |
          npm ci
          npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
      - id: deployment
        uses: actions/deploy-pages@v4

  release:
    # CD: pushing a tag like v1.0 publishes a GitHub Release with the binary and demo outputs
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: seam-carving-demo
          path: dist

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/bin/seam_carve
            dist/demo/steps.gif
            dist/demo/overlay.png
            dist/demo/comparison.png
            dist/demo/benchmark.csv
